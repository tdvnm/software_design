<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">Tracey: loading and saving a plan</title><desc id="desc">The browser fetches courses through the server from SQLite, then saves plan edits to localStorage.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7c4b69"/></marker></defs>
<rect width="1000" height="840" rx="10" fill="#fff8f8"/>
<g font-family="system-ui,sans-serif" fill="#623a52" font-size="14">
<rect x="35" y="25" width="150" height="45" rx="5" fill="#f0d4cc" stroke="#996a78"/><text x="110" y="53" text-anchor="middle">Student</text><path d="M110 70V790" stroke="#cfbcbc" stroke-dasharray="5 5"/>
<rect x="275" y="25" width="150" height="45" rx="5" fill="#f0d4cc" stroke="#996a78"/><text x="350" y="53" text-anchor="middle">Browser</text><path d="M350 70V790" stroke="#cfbcbc" stroke-dasharray="5 5"/>
<rect x="545" y="25" width="150" height="45" rx="5" fill="#f0d4cc" stroke="#996a78"/><text x="620" y="53" text-anchor="middle">Server</text><path d="M620 70V790" stroke="#cfbcbc" stroke-dasharray="5 5"/>
<rect x="790" y="25" width="150" height="45" rx="5" fill="#f0d4cc" stroke="#996a78"/><text x="865" y="53" text-anchor="middle">SQLite</text><path d="M865 70V790" stroke="#cfbcbc" stroke-dasharray="5 5"/>
<path d="M110 125H350" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230.0" y="113" text-anchor="middle">open planner</text>
<path d="M350 185H620" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485.0" y="173" text-anchor="middle">GET / and /assets/*</text>
<path d="M620 245H350" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485.0" y="233" text-anchor="middle">HTML, CSS, JavaScript</text>
<path d="M350 305H620" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485.0" y="293" text-anchor="middle">GET /api/courses</text>
<path d="M620 365H865" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="742.5" y="353" text-anchor="middle">SELECT courses + subjects</text>
<path d="M865 425H620" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="742.5" y="413" text-anchor="middle">course rows</text>
<path d="M620 485H350" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485.0" y="473" text-anchor="middle">catalogue JSON</text>
<path d="M350 600H110" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230.0" y="588" text-anchor="middle">show saved or empty plan</text>
<path d="M110 660H350" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230.0" y="648" text-anchor="middle">add, move, remove</text>
<path d="M350 775H110" stroke="#7c4b69" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230.0" y="763" text-anchor="middle">updated grid and hints</text>
<rect x="220" y="520" width="350" height="38" rx="4" fill="#e1e3e8" stroke="#c4c7ce"/><text x="395" y="544" text-anchor="middle" font-size="13">restore and validate localStorage</text>
<rect x="220" y="695" width="350" height="38" rx="4" fill="#e1e3e8" stroke="#c4c7ce"/><text x="395" y="719" text-anchor="middle" font-size="13">update plan; save JSON to localStorage</text>
</g></svg>
